name: Deploy Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # フォークからの PR にはシークレットを渡さない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 既定のマージ結果（refs/pull/N/merge）ではなく、PR の head をそのままビルドする。
      # コメントに出すコミットと、プレビューの中身を一致させるため
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: $/.github/actions/setup-pnpm

      - name: Build
        run: pnpm build

      # 本番には出さず、新しいバージョンとして上げるだけ（本番の切り替えは deploy-prod.yml の wrangler deploy）。
      # プレビュー URL は PR ごとのエイリアス（pr-<番号>）で固定し、push のたびに同じ URL の中身が新しくなる
      - name: Upload preview version
        # run の値はブロックで書く。1 行で書くと、YAML が " #" 以降をコメントとして切り落とす
        run: |
          pnpm wrangler versions upload --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER $HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Comment preview URL
        run: |
          alias_url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$OUTPUT_FILE")
          version_url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$OUTPUT_FILE")
          if [ -z "$alias_url" ]; then
            echo "::error::wrangler の出力にプレビュー URL がない"
            exit 1
          fi
          # 目印のあるコメントだけを更新する。ほかのワークフローが同じ bot で書いたコメントを上書きしないため
          marker='<!-- deploy-preview -->'
          body=$(printf '%s\n## プレビュー\n\n%s\n\n- コミット: %s\n- このコミット固定の URL: %s\n' "$marker" "$alias_url" "$HEAD_SHA" "${version_url:-なし}")
          comment_id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
