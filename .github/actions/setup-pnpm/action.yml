name: Setup pnpm

description: Node.js, pnpm のセットアップ、pnpm install、pnpm の cache

runs:
  using: composite
  steps:
    # バージョンは package.json の packageManager から読み込む
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1

    # バージョンは package.json の engines.node から読み込む
    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm i --frozen-lockfile
